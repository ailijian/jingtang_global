services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jingtang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingtang"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - jingtang-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jingtang_local
      MINIO_ROOT_PASSWORD: local_storage_only_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - jingtang-minio:/data

volumes:
  jingtang-postgres:
  jingtang-minio:
