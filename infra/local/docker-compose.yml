services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: jingtang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingtang"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - jingtang-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  jingtang-postgres:
