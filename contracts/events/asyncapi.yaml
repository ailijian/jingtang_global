asyncapi: 3.0.0
info:
  title: JINGTANG Domain Events
  version: 1.0.0
  description: D2 event envelope; external publishing channels are not implemented in this Stage.
channels:
  auditEvents:
    address: audit.events.v1
    messages:
      auditEvent:
        $ref: "#/components/messages/AuditEvent"
operations:
  receiveAuditEvent:
    action: receive
    channel:
      $ref: "#/channels/auditEvents"
    messages:
      - $ref: "#/channels/auditEvents/messages/auditEvent"
components:
  messages:
    AuditEvent:
      name: AuditEvent
      contentType: application/json
      payload:
        $ref: ../schemas/audit/v1/audit-event.schema.json
