asyncapi: 3.0.0
info:
  title: JINGTANG Domain Events
  version: 1.0.0
  description: Append-only audit events and D5 asynchronous platform execution commands.
channels:
  auditEvents:
    address: audit.events.v1
    messages:
      auditEvent:
        $ref: "#/components/messages/AuditEvent"
  youtubePublish:
    address: platform.youtube.publish.v1
    messages:
      youtubePublish:
        $ref: "#/components/messages/YouTubePublish"
operations:
  receiveAuditEvent:
    action: receive
    channel:
      $ref: "#/channels/auditEvents"
    messages:
      - $ref: "#/channels/auditEvents/messages/auditEvent"
  executeYouTubePublish:
    action: receive
    channel:
      $ref: "#/channels/youtubePublish"
    messages:
      - $ref: "#/channels/youtubePublish/messages/youtubePublish"
components:
  messages:
    AuditEvent:
      name: AuditEvent
      contentType: application/json
      payload:
        $ref: ../schemas/audit/v1/audit-event.schema.json
    YouTubePublish:
      name: YouTubePublish
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [workspace_id, platform_execution_id]
        properties:
          workspace_id: { type: string, format: uuid }
          platform_execution_id: { type: string, format: uuid }
