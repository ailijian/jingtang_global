asyncapi: 3.0.0
info:
  title: JINGTANG Domain Events
  version: 1.0.0
  description: Append-only audit events and D5 asynchronous platform execution commands.
channels:
  auditEvents:
    address: audit.events.v1
    messages:
      auditEvent:
        $ref: "#/components/messages/AuditEvent"
  youtubePublish:
    address: platform.youtube.publish.v1
    messages:
      youtubePublish:
        $ref: "#/components/messages/YouTubePublish"
  facebookPublish:
    address: platform.facebook.publish.v1
    messages:
      facebookPublish:
        $ref: "#/components/messages/FacebookPublish"
  instagramPublish:
    address: platform.instagram.publish.v1
    messages:
      instagramPublish:
        $ref: "#/components/messages/InstagramPublish"
  tiktokPublish:
    address: platform.tiktok.publish.v1
    messages:
      tiktokPublish:
        $ref: "#/components/messages/TikTokPublish"
operations:
  receiveAuditEvent:
    action: receive
    channel:
      $ref: "#/channels/auditEvents"
    messages:
      - $ref: "#/channels/auditEvents/messages/auditEvent"
  executeYouTubePublish:
    action: receive
    channel:
      $ref: "#/channels/youtubePublish"
    messages:
      - $ref: "#/channels/youtubePublish/messages/youtubePublish"
  executeFacebookPublish:
    action: receive
    channel:
      $ref: "#/channels/facebookPublish"
    messages:
      - $ref: "#/channels/facebookPublish/messages/facebookPublish"
  executeInstagramPublish:
    action: receive
    channel:
      $ref: "#/channels/instagramPublish"
    messages:
      - $ref: "#/channels/instagramPublish/messages/instagramPublish"
  executeTikTokPublish:
    action: receive
    channel:
      $ref: "#/channels/tiktokPublish"
    messages:
      - $ref: "#/channels/tiktokPublish/messages/tiktokPublish"
components:
  messages:
    AuditEvent:
      name: AuditEvent
      contentType: application/json
      payload:
        $ref: ../schemas/audit/v1/audit-event.schema.json
    YouTubePublish:
      name: YouTubePublish
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [workspace_id, platform_execution_id]
        properties:
          workspace_id: { type: string, format: uuid }
          platform_execution_id: { type: string, format: uuid }
    FacebookPublish:
      name: FacebookPublish
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [workspace_id, platform_execution_id]
        properties:
          workspace_id: { type: string, format: uuid }
          platform_execution_id: { type: string, format: uuid }
    InstagramPublish:
      name: InstagramPublish
      title: Provider-independent Instagram publish checkpoint command
      summary: Carries identifiers only; no token, caption, source object key, or signed media URL.
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [workspace_id, platform_execution_id]
        properties:
          workspace_id: { type: string, format: uuid }
          platform_execution_id: { type: string, format: uuid }
    TikTokPublish:
      name: TikTokPublish
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [workspace_id, platform_execution_id]
        properties:
          workspace_id: { type: string, format: uuid }
          platform_execution_id: { type: string, format: uuid }
