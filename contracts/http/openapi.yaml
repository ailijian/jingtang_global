openapi: 3.1.0
info:
  title: JINGTANG Platform API
  version: 1.0.0
  description: D2 identity and Workspace boundary plus D4 Source Asset, content revision, and approval operations.
servers:
  - url: /api/v1
paths:
  /auth/signup:
    post:
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, password, locale, consent]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 12, maxLength: 128 }
                locale: { type: string, enum: [en, zh-CN] }
                consent: { const: true }
      responses:
        "201": { description: Confirmed account and server-managed session created. }
        "202": { description: Account awaits identity-provider confirmation. }
  /auth/confirm:
    post:
      operationId: confirmSignUp
      security: []
      responses:
        "200": { description: Identity confirmed. }
  /auth/login:
    post:
      operationId: login
      security: []
      responses:
        "200": { description: Server-managed session created. }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: Session invalidated and cookie cleared. }
  /auth/password/request:
    post:
      operationId: requestPasswordReset
      security: []
      responses:
        "200":
          { description: Generic reset acceptance response; does not reveal account existence. }
  /auth/password/confirm:
    post:
      operationId: confirmPasswordReset
      security: []
      responses:
        "200": { description: Password reset confirmed by the identity provider. }
  /session:
    get:
      operationId: getSession
      responses:
        "200": { description: Current server-managed session and available Workspace contexts. }
  /locale:
    put:
      operationId: updateLocalePreference
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/identity/v1/locale-preference.schema.json
      responses:
        "200": { description: Authenticated preference and/or local cookie persisted. }
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200": { description: Workspaces available to the authenticated user. }
    post:
      operationId: createWorkspace
      responses:
        "201": { description: Workspace and Owner/Admin membership created atomically. }
  /workspaces/select:
    post:
      operationId: selectWorkspace
      responses:
        "200": { description: Authorized Workspace selected for the current session. }
  /invitations:
    post:
      operationId: inviteMember
      responses:
        "201": { description: Tenant-bound invitation created by an authorized member. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      responses:
        "200": { description: Matching invited identity joined the Workspace. }
  /members/{membershipId}:
    parameters:
      - name: membershipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMemberRole
      responses:
        "200": { description: Role changed without removing the last Owner/Admin. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { description: The change would remove the last Owner/Admin. }
    delete:
      operationId: removeMember
      responses:
        "200": { description: Membership removed without removing the last Owner/Admin. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { description: The change would remove the last Owner/Admin. }
  /content/assets:
    post:
      operationId: uploadSourceAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [asset, ownershipConfirmed]
              properties:
                asset: { type: string, format: binary }
                ownershipConfirmed: { type: string, const: "true" }
      responses:
        "201":
          description: User-owned Source Asset stored privately.
          content:
            application/json:
              schema:
                $ref: ../schemas/content/v1/source-asset.schema.json
        "400": { description: Asset or ownership confirmation is invalid. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "413": { description: Source Asset exceeds the configured maximum. }
        "503": { description: Storage failed and content creation remains blocked. }
  /content:
    get:
      operationId: listContent
      responses:
        "200": { description: Tenant-scoped Content summaries. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      operationId: createContent
      responses:
        "201": { description: Draft Content and immutable revision boundary created. }
        "400": { description: Platform version validation failed. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409":
          {
            description: Source Asset is incomplete,
            failed,
            owned by another tenant,
            or already attached.,
          }
  /content/{contentId}:
    parameters:
      - name: contentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getContentDetail
      responses:
        "200": { description: Single operational Content view. }
        "404": { description: Content is absent from the active Workspace. }
    patch:
      operationId: editContentRevision
      responses:
        "200": { description: Draft updated or a new Draft revision created after a decision. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { description: Pending revisions are immutable. }
  /content/{contentId}/submit:
    parameters:
      - name: contentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: submitContentRevision
      responses:
        "200": { description: Exact complete Draft revision submitted for human approval. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { description: Content is not in a submittable state. }
  /content/{contentId}/decision:
    parameters:
      - name: contentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: decideContentRevision
      responses:
        "200":
          {
            description: Exact pending revision approved or rejected; no platform operation starts.,
          }
        "400": { description: Rejection reason is missing. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { description: Revision is stale or no longer pending. }
  /content/{contentId}/publish:
    parameters:
      - name: contentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmContentPublishing
      description: Creates one immutable tenant-bound Publishing Intent, Platform Execution, outbox message, and audit record without performing the external upload in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revisionId, idempotencyKey, confirmed]
              properties:
                revisionId: { type: string, format: uuid }
                idempotencyKey: { type: string, format: uuid }
                confirmed: { type: boolean, const: true }
      responses:
        "202":
          description: Exact approved private YouTube upload accepted for asynchronous execution.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [intent_id, execution_id]
                properties:
                  intent_id: { type: string, format: uuid }
                  execution_id: { type: string, format: uuid }
        "400": { description: Confirmation or the Test private-visibility restriction is invalid. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404":
          { description: Content or connected target channel is absent from the active Workspace. }
        "409":
          {
            description: The exact revision is no longer publishable or conflicts with the idempotency key.,
          }
  /activity:
    get:
      operationId: listActivity
      responses:
        "200": { description: Tenant-scoped append-only audit activity. }
        "403": { $ref: "#/components/responses/PermissionDenied" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-jt_session
  responses:
    PermissionDenied:
      description: Deny-by-default RBAC rejected the operation.
security:
  - sessionCookie: []
