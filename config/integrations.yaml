revision_note: >-
  Revision 9 replaces TikTok R4 FILE_UPLOAD with PULL_FROM_URL for server-stored media. Exact candidate 8d35648aac362d2722671fdd8ae7d418368aa235 is deployed to Review with hold-worker after blocking CI; COS remains private and only the final-confirmed object may be exposed to TikTok through a 65-minute provider-only HTTPS grant bound to object key, hash, size and GET. TikTok Dashboard reports review.jingtangai.com as a verified Domain property. Fresh Human E2E, Acceptance, provider credentials/API calls, publishing and external submission remain unperformed. R4.5 Instagram remains paused. Facebook, TikTok and Instagram remain publicly Coming Soon and production_available false.

authority:
  owns:
    - public_status
    - production_availability
    - platform_capabilities
    - oauth_scope_intent
    - review_and_audit_constraints
  public_status_values:
    - available
    - beta_early_access
    - coming_soon
  capability_state_values:
    - available
    - not_available
  default_rule: deny_and_do_not_render_an_action_unless_the_registry_marks_it_available
  localization_rule: machine status and capability values are canonical; reviewed en and zh-CN message catalogs render labels and limitations with semantic parity
  public_label_note: public_label fields are English reference labels only and are not the runtime translation source

