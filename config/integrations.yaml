integrations:
  youtube:
    display_name: YouTube
    wave: wave_1
    delivery_role: first_production_channel
    public_status: coming_soon
    production_available: false
    implementation_stage: review_r2_controlled_access
    capabilities:
      connect:
        state: not_available
        public_label: Coming Soon
      publish_now:
        state: not_available
        public_label: Coming Soon
      schedule:
        state: not_available
        public_label: Schedule Not Available
      track_result:
        state: not_available
        public_label: Coming Soon
      reauthorize:
        state: not_available
        public_label: Coming Soon
      disconnect_and_revoke:
        state: not_available
        public_label: Coming Soon
    authorization:
      mechanism: google_oauth_2_web_server
      official_only: true
      incremental_authorization: true
      requested_scopes:
        - scope: https://www.googleapis.com/auth/youtube.upload
          request_state: active_for_controlled_access
          purpose: upload the exact user-approved video and metadata after explicit Publish Confirmation
          baseline_trace:
            - AC-07
            - AC-09
            - AC-15
          design_trace:
            - D-02
            - D-05
            - D-12
          ui_surface:
            - Channels / Connect YouTube / permission explanation
            - Content Review / explicit Publish Confirmation
            - Content Detail / per-platform execution result
          user_action:
            - user explicitly connects a YouTube channel
            - authorized Publisher explicitly confirms the exact video, channel, fields, and privacy setting
          api_methods:
            - videos.insert for user-confirmed upload
        - scope: https://www.googleapis.com/auth/youtube.readonly
          request_state: active_for_controlled_access
          purpose: identify the exact authorized YouTube channel before confirmation and read the owner-only processing/result state of the returned uploaded video
          baseline_trace:
            - AC-07
            - AC-09
            - AC-15
          design_trace:
            - D-02
            - D-05
            - D-12
          ui_surface:
            - Channels / connected YouTube channel identity
            - Content Review / exact target channel
            - Content Detail / processing and result tracking
          user_action:
            - user explicitly connects a YouTube channel
            - system tracks only the video returned by the user's confirmed upload
          api_methods:
            - channels.list mine=true for connected-channel identity
            - videos.list by returned video ID for owner-only processing/result tracking
      excluded_scopes:
        - scope: https://www.googleapis.com/auth/youtube
          reason: broader account management is not required for the V1 upload slice
        - scope: https://www.googleapis.com/auth/youtube.force-ssl
          reason: edit/delete breadth is not required for the V1 upload slice
        - scope: https://www.googleapis.com/auth/youtubepartner
          reason: content-owner/CMS operations are outside V1
        - scope: https://www.googleapis.com/auth/youtubepartner-channel-audit
          reason: partner channel audit access is outside V1
    current_constraints:
      - production and test must use separate Google Cloud projects and OAuth clients
      - all consent-screen domains must be owned and verified and all production redirects must use HTTPS
      - the production consent screen, homepage, legal pages, support email, and legal entity must use the frozen identity
      - uploads from qualifying unverified API projects are restricted to private viewing until the required audit is passed
      - upload and quota/audit state must be shown truthfully and cannot be treated as Available before real production verification
      - ordinary Authorized API Data must be refreshed or deleted within 30 calendar days
      - in-product revocation must programmatically revoke immediately and applicable Authorized Data must be deleted as soon as possible and within 7 calendar days
      - Schedule is not available and no scheduler or status claim may be exposed
      - real OAuth, authorized-channel identity, private upload, result tracking, disconnect, revocation, and cleanup are deployed for approved accounts on the current Seoul service; broader public availability remains false until the formal production gates and rollout decision pass
    d5_entry_gates:
      - current official policy re-verification recorded
      - official domain, domain email, English legal entity expression, homepage, Privacy, Terms, Data Deletion, Security, and YouTube Integration page are live and consistent
      - separate test and production Google Cloud projects and current IAM contacts are evidenced
      - HTTPS redirect URIs and domain ownership are evidenced
      - reviewer/test channel and support contact are available in protected inventory
      - the Human-approved youtube.upload and youtube.readonly scopes are configured exactly in the test and production projects; any additional scope requires explicit registry revision
      - project verification, audit, quota, and private-upload limitation are recorded as actual external state
      - token encryption, consent record, immutable publish intent, per-platform execution, and required D5 audit event contracts exist before Test credentials are used
    pre_production_gates:
      - D6 repository controls for programmatic revoke, applicable Authorized Data deletion, retention jobs, audit, and recovery are verified; D7 must verify their deployed production configuration and evidence
      - D7 deployed dispatcher to Tencent TDMQ to worker execution path, secrets, keys, monitoring, and recovery controls are verified
      - production OAuth client, support contact, verification, audit, quota, reviewer access, and rollout authorization reflect actual external state

  facebook:
    display_name: Facebook
    wave: wave_1
    delivery_role: r3_facebook_review_slice
    public_status: coming_soon
    production_available: false
    implementation_stage: review_r3_technical_slice_complete_external_review_deferred
    capabilities:
      connect: {state: not_available, public_label: Coming Soon}
      publish_now: {state: not_available, public_label: Coming Soon}
      schedule: {state: not_available, public_label: Schedule Not Available}
      track_result: {state: not_available, public_label: Coming Soon}
      reauthorize: {state: not_available, public_label: Coming Soon}
      disconnect_and_revoke: {state: not_available, public_label: Coming Soon}
    controlled_access_state: deployed_controlled_access_human_e2e_pass
    authorization:
      mechanism: meta_oauth_web_server
      api_version_intent: v26.0
      app_ownership: company_business_portfolio_durable_app_id
      requested_scopes:
        - scope: pages_show_list
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: show only Pages the authenticating person manages and verify the explicitly selected Page
          ui_surface:
            - Channels / Connect Facebook / permission explanation
            - Channels / eligible Page selection
          user_action:
            - user explicitly connects Facebook
            - user explicitly selects one eligible Page
          api_methods:
            - GET /me/accounts with minimum fields
        - scope: pages_read_engagement
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: read the selected Page identity and track only the Page video returned by the user's confirmed publish
          depends_on:
            - pages_show_list
          ui_surface:
            - Channels / connected Facebook Page identity
            - Content Detail / exact returned execution result
          user_action:
            - user explicitly connects and selects a Page
            - system tracks only the returned video from an explicit publish
          api_methods:
            - read selected Page metadata
            - read returned video ID with minimum supported result fields
        - scope: pages_manage_posts
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: create one native video on the exact selected Page after a separate immutable Publish Now confirmation
          depends_on:
            - pages_show_list
            - pages_read_engagement
          ui_surface:
            - Content Review / Facebook platform version
            - Publish Confirmation / exact Page, MP4, title and description
          user_action:
            - authorized Publisher explicitly confirms the exact approved content and Page
          api_methods:
            - POST /{APP_ID}/uploads and /upload:{UPLOAD_SESSION_ID}
            - POST /{PAGE_ID}/videos
      automatic_scopes:
        - scope: public_profile
          purpose: minimum Meta login identity binding; email is not requested
      excluded_scopes:
        - scope: publish_video
          reason: official allowed use is Live Video; R3 publishes an ordinary Page video
        - scope: pages_manage_metadata
          reason: no Page Webhooks or Page settings management
        - scope: business_management
          reason: no runtime Business Manager asset management
        - scope: read_insights
          reason: no analytics
        - scope: pages_read_user_content
          reason: no fan, comment, visitor-post or unrelated Page-content read
        - scope: pages_manage_engagement
          reason: no comment or reaction moderation
        - scope: pages_messaging
          reason: no Messenger capability
        - scope: ads_management
          reason: no Ads capability
        - scope: user_videos
          reason: no Profile video access
        - scope: email
          reason: local JINGTANG identity exists and Facebook email is unnecessary
        - scope: instagram_and_threads_permissions
          reason: excluded from R3 and require separate approval
    current_constraints:
      - public status remains Coming Soon and no public executable entry is rendered
      - R3 is one selected Facebook Page, one approved MP4 up to 500 MiB, and Publish Now only
      - no Page privacy selector; Facebook and Page settings control visibility and distribution
      - no host media persistence or server-side transcoding
      - tokens are server-only and use the per-connection environment envelope
      - disconnect, deauthorization and deletion deny first, revoke permissions and remove provider linkage under the 7/30-day minimization controls
      - JINGTANG does not claim that local deletion removes the already-published Facebook video
      - company Business Portfolio owns the durable Meta App ID; Review secrets, tokens, URLs, data and runtime configuration are retired before future production cutover
    r3_entry_gates:
      - scope_approval: passed_2026_08_26
      - security_data_processor_update: passed_2026_08_26
      - business_portfolio_and_page: configured_2026_08_27
      - meta_app_and_business_verification: app_configured_business_verification_pending
      - implementation_and_callbacks: deployed_callbacks_configured_deauthorization_and_data_deletion_signed_e2e_pass
      - code_review: passed_2026_08_27
      - acceptance_review: passed_2026_08_27
      - technical_stage_acceptance: passed_2026_08_27
      - human_e2e: page_publish_disconnect_reconnect_deauthorization_and_data_deletion_callbacks_pass
      - reviewer_materials_and_external_prerequisites: deferred_to_unified_r5_submission_stage
      - external_app_review_submission: unified_r5_separately_gated

