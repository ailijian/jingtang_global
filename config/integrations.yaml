schema_version: 1
revision: 23
status: approved
effective_date: "2026-08-28"
owner: JINGTANG Integration Owner
last_policy_verification_date: "2026-08-27"
revision_note: The R3 Facebook controlled-access technical slice is complete and accepted while its external submission work remains deferred to R5. The R4 TikTok controlled Review slice has a deployed implementation, one completed private Direct Post and completed local authorization/key cleanup, but the 2026-08-28 Acceptance Review found formal-presentation, architecture, Security/Data, legal/versioned-consent, final Code Review and independently observed no-intervention lifecycle-evidence gaps. The local remediation passed canonical self-verification; final Code Review, authorized deployment, complete Human E2E evidence and re-review remain pending. TikTok remains publicly Coming Soon and production_available false; another connection or publish, external audit/App Review, public availability, checkpoint and repository synchronization are separately gated.

authority:
  owns:
    - public_status
    - production_availability
    - platform_capabilities
    - oauth_scope_intent
    - review_and_audit_constraints
  public_status_values:
    - available
    - beta_early_access
    - coming_soon
  capability_state_values:
    - available
    - not_available
  default_rule: deny_and_do_not_render_an_action_unless_the_registry_marks_it_available
  localization_rule: machine status and capability values are canonical; reviewed en and zh-CN message catalogs render labels and limitations with semantic parity
  public_label_note: public_label fields are English reference labels only and are not the runtime translation source

