integrations:
  youtube:
    display_name: YouTube
    wave: wave_1
    delivery_role: first_production_channel
    public_status: coming_soon
    production_available: false
    implementation_stage: review_r2_controlled_access
    capabilities:
      connect:
        state: not_available
        public_label: Coming Soon
      publish_now:
        state: not_available
        public_label: Coming Soon
      schedule:
        state: not_available
        public_label: Schedule Not Available
      track_result:
        state: not_available
        public_label: Coming Soon
      reauthorize:
        state: not_available
        public_label: Coming Soon
      disconnect_and_revoke:
        state: not_available
        public_label: Coming Soon
    authorization:
      mechanism: google_oauth_2_web_server
      official_only: true
      incremental_authorization: true
      requested_scopes:
        - scope: https://www.googleapis.com/auth/youtube.upload
          request_state: active_for_controlled_access
          purpose: upload the exact user-approved video and metadata after explicit Publish Confirmation
          baseline_trace:
            - AC-07
            - AC-09
            - AC-15
          design_trace:
            - D-02
            - D-05
            - D-12
          ui_surface:
            - Channels / Connect YouTube / permission explanation
            - Content Review / explicit Publish Confirmation
            - Content Detail / per-platform execution result
          user_action:
            - user explicitly connects a YouTube channel
            - authorized Publisher explicitly confirms the exact video, channel, fields, and privacy setting
          api_methods:
            - videos.insert for user-confirmed upload
        - scope: https://www.googleapis.com/auth/youtube.readonly
          request_state: active_for_controlled_access
          purpose: identify the exact authorized YouTube channel before confirmation and read the owner-only processing/result state of the returned uploaded video
          baseline_trace:
            - AC-07
            - AC-09
            - AC-15
          design_trace:
            - D-02
            - D-05
            - D-12
          ui_surface:
            - Channels / connected YouTube channel identity
            - Content Review / exact target channel
            - Content Detail / processing and result tracking
          user_action:
            - user explicitly connects a YouTube channel
            - system tracks only the video returned by the user's confirmed upload
          api_methods:
            - channels.list mine=true for connected-channel identity
            - videos.list by returned video ID for owner-only processing/result tracking
      excluded_scopes:
        - scope: https://www.googleapis.com/auth/youtube
          reason: broader account management is not required for the V1 upload slice
        - scope: https://www.googleapis.com/auth/youtube.force-ssl
          reason: edit/delete breadth is not required for the V1 upload slice
        - scope: https://www.googleapis.com/auth/youtubepartner
          reason: content-owner/CMS operations are outside V1
        - scope: https://www.googleapis.com/auth/youtubepartner-channel-audit
          reason: partner channel audit access is outside V1
    current_constraints:
      - production and test must use separate Google Cloud projects and OAuth clients
      - all consent-screen domains must be owned and verified and all production redirects must use HTTPS
      - the production consent screen, homepage, legal pages, support email, and legal entity must use the frozen identity
      - uploads from qualifying unverified API projects are restricted to private viewing until the required audit is passed
      - upload and quota/audit state must be shown truthfully and cannot be treated as Available before real production verification
      - ordinary Authorized API Data must be refreshed or deleted within 30 calendar days
      - in-product revocation must programmatically revoke immediately and applicable Authorized Data must be deleted as soon as possible and within 7 calendar days
      - Schedule is not available and no scheduler or status claim may be exposed
      - real OAuth, authorized-channel identity, private upload, result tracking, disconnect, revocation, and cleanup are deployed for approved accounts on the current Seoul service; broader public availability remains false until the formal production gates and rollout decision pass
    d5_entry_gates:
      - current official policy re-verification recorded
      - official domain, domain email, English legal entity expression, homepage, Privacy, Terms, Data Deletion, Security, and YouTube Integration page are live and consistent
      - separate test and production Google Cloud projects and current IAM contacts are evidenced
      - HTTPS redirect URIs and domain ownership are evidenced
      - reviewer/test channel and support contact are available in protected inventory
      - the Human-approved youtube.upload and youtube.readonly scopes are configured exactly in the test and production projects; any additional scope requires explicit registry revision
      - project verification, audit, quota, and private-upload limitation are recorded as actual external state
      - token encryption, consent record, immutable publish intent, per-platform execution, and required D5 audit event contracts exist before Test credentials are used
    pre_production_gates:
      - D6 repository controls for programmatic revoke, applicable Authorized Data deletion, retention jobs, audit, and recovery are verified; D7 must verify their deployed production configuration and evidence
      - D7 deployed dispatcher to Tencent TDMQ to worker execution path, secrets, keys, monitoring, and recovery controls are verified
      - production OAuth client, support contact, verification, audit, quota, reviewer access, and rollout authorization reflect actual external state

  facebook:
    display_name: Facebook
    wave: wave_1
    delivery_role: r3_facebook_review_slice
    public_status: coming_soon
    production_available: false
    implementation_stage: review_r3_technical_slice_complete_external_review_deferred
    capabilities:
      connect: {state: not_available, public_label: Coming Soon}
      publish_now: {state: not_available, public_label: Coming Soon}
      schedule: {state: not_available, public_label: Schedule Not Available}
      track_result: {state: not_available, public_label: Coming Soon}
      reauthorize: {state: not_available, public_label: Coming Soon}
      disconnect_and_revoke: {state: not_available, public_label: Coming Soon}
    controlled_access_state: deployed_controlled_access_human_e2e_pass
    authorization:
      mechanism: meta_oauth_web_server
      api_version_intent: v26.0
      app_ownership: company_business_portfolio_durable_app_id
      requested_scopes:
        - scope: pages_show_list
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: show only Pages the authenticating person manages and verify the explicitly selected Page
          ui_surface:
            - Channels / Connect Facebook / permission explanation
            - Channels / eligible Page selection
          user_action:
            - user explicitly connects Facebook
            - user explicitly selects one eligible Page
          api_methods:
            - GET /me/accounts with minimum fields
        - scope: pages_read_engagement
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: read the selected Page identity and track only the Page video returned by the user's confirmed publish
          depends_on:
            - pages_show_list
          ui_surface:
            - Channels / connected Facebook Page identity
            - Content Detail / exact returned execution result
          user_action:
            - user explicitly connects and selects a Page
            - system tracks only the returned video from an explicit publish
          api_methods:
            - read selected Page metadata
            - read returned video ID with minimum supported result fields
        - scope: pages_manage_posts
          request_state: implemented_controlled_access_unified_submission_pending
          purpose: create one native video on the exact selected Page after a separate immutable Publish Now confirmation
          depends_on:
            - pages_show_list
            - pages_read_engagement
          ui_surface:
            - Content Review / Facebook platform version
            - Publish Confirmation / exact Page, MP4, title and description
          user_action:
            - authorized Publisher explicitly confirms the exact approved content and Page
          api_methods:
            - POST /{APP_ID}/uploads and /upload:{UPLOAD_SESSION_ID}
            - POST /{PAGE_ID}/videos
      automatic_scopes:
        - scope: public_profile
          purpose: minimum Meta login identity binding; email is not requested
      excluded_scopes:
        - scope: publish_video
          reason: official allowed use is Live Video; R3 publishes an ordinary Page video
        - scope: pages_manage_metadata
          reason: no Page Webhooks or Page settings management
        - scope: business_management
          reason: no runtime Business Manager asset management
        - scope: read_insights
          reason: no analytics
        - scope: pages_read_user_content
          reason: no fan, comment, visitor-post or unrelated Page-content read
        - scope: pages_manage_engagement
          reason: no comment or reaction moderation
        - scope: pages_messaging
          reason: no Messenger capability
        - scope: ads_management
          reason: no Ads capability
        - scope: user_videos
          reason: no Profile video access
        - scope: email
          reason: local JINGTANG identity exists and Facebook email is unnecessary
        - scope: instagram_and_threads_permissions
          reason: excluded from R3 and require separate approval
    current_constraints:
      - public status remains Coming Soon and no public executable entry is rendered
      - R3 is one selected Facebook Page, one approved MP4 up to 500 MiB, and Publish Now only
      - no Page privacy selector; Facebook and Page settings control visibility and distribution
      - no host media persistence or server-side transcoding
      - tokens are server-only and use the per-connection environment envelope
      - disconnect, deauthorization and deletion deny first, revoke permissions and remove provider linkage under the 7/30-day minimization controls
      - JINGTANG does not claim that local deletion removes the already-published Facebook video
      - company Business Portfolio owns the durable Meta App ID; Review secrets, tokens, URLs, data and runtime configuration are retired before future production cutover
    r3_entry_gates:
      - scope_approval: passed_2026_08_26
      - security_data_processor_update: passed_2026_08_26
      - business_portfolio_and_page: configured_2026_08_27
      - meta_app_and_business_verification: app_configured_business_verification_pending
      - implementation_and_callbacks: deployed_callbacks_configured_deauthorization_and_data_deletion_signed_e2e_pass
      - code_review: passed_2026_08_27
      - acceptance_review: passed_2026_08_27
      - technical_stage_acceptance: passed_2026_08_27
      - human_e2e: page_publish_disconnect_reconnect_deauthorization_and_data_deletion_callbacks_pass
      - reviewer_materials_and_external_prerequisites: deferred_to_unified_r5_submission_stage
      - external_app_review_submission: unified_r5_separately_gated

  instagram:
    display_name: Instagram
    wave: wave_1
    delivery_role: r4_5_instagram_review_slice
    public_status: coming_soon
    production_available: false
    implementation_stage: r4_5_paused_controlled_professional_account_unavailable
    capabilities:
      connect: {state: not_available, public_label: Coming Soon}
      publish_now: {state: not_available, public_label: Coming Soon}
      schedule: {state: not_available, public_label: Schedule Not Available}
      track_result: {state: not_available, public_label: Coming Soon}
      reauthorize: {state: not_available, public_label: Coming Soon}
      disconnect_and_revoke: {state: not_available, public_label: Coming Soon}
    authorization:
      mechanism: instagram_api_with_instagram_login_web
      app_ownership: separate_company_business_portfolio_durable_app_id
      account_boundary: one_company_controlled_professional_account
      requested_scopes:
        - scope: instagram_business_basic
          request_state: approved_provider_independent_candidate_only
          purpose: bind the exact authorized Professional account and display only user_id and username
          baseline_trace:
            - AC-15
            - AC-16
          design_trace:
            - D-02
            - D-05
            - D-12
          ui_surface:
            - Channels / Connect Instagram / purpose and permission explanation
            - Channels / exact Professional account identity
            - Publish Confirmation / exact account and removal consequence
          user_action:
            - user explicitly accepts the current legal and Instagram data-purpose notice
            - user explicitly connects the one controlled Professional account
          api_methods:
            - GET /me?fields=user_id,username
        - scope: instagram_business_content_publish
          request_state: approved_provider_independent_candidate_only
          purpose: create and publish one explicitly confirmed MP4 Reel and track only that returned container and media
          baseline_trace:
            - AC-15
            - AC-16
          design_trace:
            - D-02
            - D-03
            - D-05
            - D-12
          ui_surface:
            - Content Review / Instagram Reel platform version and caption
            - Publish Confirmation / exact account, MP4, caption, REELS and share_to_feed false
            - Content Detail / returned container and publish result
          user_action:
            - authorized Publisher explicitly confirms the exact account, approved MP4, caption and Reels-tab-only distribution
          api_methods:
            - GET /{IG_USER_ID}/content_publishing_limit
            - POST /{IG_USER_ID}/media with media_type=REELS and share_to_feed=false
            - GET /{CONTAINER_ID}?fields=status_code,status
            - POST /{IG_USER_ID}/media_publish exactly once for the approved intent
            - GET /{MEDIA_ID} with only approved result fields
      excluded_scopes:
        - scope: instagram_business_manage_comments
          reason: no comment reading or moderation
        - scope: instagram_business_manage_messages
          reason: no messaging
        - scope: instagram_business_content_publish_beyond_reels
          reason: images, carousels, Stories, feed sharing, scheduling, editing and deletion are outside R4.5
        - scope: facebook_login_and_page_permissions
          reason: R4.5 uses a separate Instagram Login App and does not reuse the R3 Facebook Login authorization path
    current_constraints:
      - public status remains Coming Soon and no public executable entry is rendered
      - provider-independent domain, persistence, contracts, UI skeleton and deterministic fixtures are implemented locally
      - a separate Business Portfolio-owned Instagram Login App and exact Review redirect are configured; deauthorization and data-deletion callback fields were observed but left empty because no callback-capable candidate is deployed
      - the company-controlled Professional account could not complete registration/review in a searchable state, so tester binding, Standard Access, OAuth and callback evidence are paused by Human Owner decision on 2026-08-29
      - one company-controlled Professional account, one approved MP4 Reel, user-confirmed caption, media_type REELS, fixed share_to_feed false and Publish Now only
      - the worker may generate a server-to-Meta HTTPS URL only after immutable confirmation; it is object/method-bound, shortest feasible and at most 60 minutes, and must never reach browser, persistence, logs, audit, metrics, screenshots or reviewer media
      - disconnect denies and fences immediately, cancels queued work, destroys the local token key and authorization/account data, stops refresh and requires the user to remove the App in Instagram
      - local disconnect or token expiry is never represented as Meta-side revocation; only a verified deauthorization callback may confirm provider revocation
      - no Facebook User Permissions delete endpoint is called or inferred for Instagram Login
      - the Instagram-hosted Reel is not implicitly deleted by disconnect or JINGTANG data deletion
      - actual callback identity mapping, dedicated App/Standard Access configuration and COS fetch/TTL compatibility remain external evidence gates
    r4_5_entry_gates:
      - scope_approval: passed_2026_08_28_baseline_revision_8
      - registry_design_architecture_security_data_legal_test_operations_alignment: passed_2026_08_28_full_verify
      - provider_independent_implementation: local_candidate_complete_code_review_passed_2026_08_28
      - provider_dependent_implementation_authorization: not_granted
      - dedicated_app_configuration: separate_instagram_login_app_and_review_redirect_configured_2026_08_28
      - controlled_professional_account: blocked_registration_review_not_searchable_paused_2026_08_29
      - callback_identity_mapping: blocked_controlled_account_and_callback_deployment_pending
      - standard_access_configuration: blocked_controlled_account_binding_pending
      - cos_fetch_and_ttl_compatibility: external_evidence_pending_separate_authorization
      - deployment_and_real_publish: not_authorized

  tiktok:
    display_name: TikTok
    wave: wave_2
    delivery_role: r4_tiktok_review_slice
    public_status: coming_soon
    production_available: false
    implementation_stage: r4_technical_stage_accepted
    capabilities:
      connect: {state: not_available, public_label: Coming Soon}
      publish_now: {state: not_available, public_label: Coming Soon}
      schedule: {state: not_available, public_label: Schedule Not Available}
      track_result: {state: not_available, public_label: Coming Soon}
      reauthorize: {state: not_available, public_label: Coming Soon}
      disconnect_and_revoke: {state: not_available, public_label: Coming Soon}
    authorization:
      mechanism: tiktok_login_kit_web_oauth_2
      app_ownership: company_tiktok_organization_durable_app_identity
      api_version_intent: v2
      media_transfer: pull_from_url_only
      automatic_scopes:
        - scope: user.info.basic
          purpose: bind the OAuth result to the exact TikTok user by open_id and render the minimum connected-account identity without reading the user's feed
      requested_scopes:
        - scope: video.publish
          request_state: implemented_controlled_access_private_publish_passed
          purpose: query fresh Creator Info, directly post the one explicitly confirmed video and track only the returned publish_id
          baseline_trace:
            - AC-08
            - AC-10
            - AC-12
          ui_surface:
            - Channels / Connect TikTok / identity and permission explanation
            - Content Review / fresh Creator Info, caption, privacy, interactions and disclosures
            - Publish Confirmation / exact account, MP4, fields and policy consent
            - Content Detail / returned processing or failure status
          user_action:
            - user explicitly connects their TikTok account
            - authorized Publisher manually selects an allowed privacy value and explicitly confirms the exact account, media and fields
          api_methods:
            - POST /v2/post/publish/creator_info/query/
            - POST /v2/post/publish/video/init/ with PULL_FROM_URL and the final-confirmed provider-only HTTPS URL
            - POST /v2/post/publish/status/fetch/ for the returned publish_id
      excluded_scopes:
        - scope: video.upload
          reason: R4 is Direct Post only and does not create TikTok Inbox drafts
        - scope: video.list
          reason: R4 does not read existing TikTok posts or synchronize a feed
        - scope: expanded_profile_metrics_and_other_products
          reason: expanded profile data, Display API, Research, Data Portability, Ads, Messaging, Comments, Share Kit, Photos and Webhooks are outside R4
    current_constraints:
      - public status remains Coming Soon and no public executable entry is rendered
      - before TikTok audit, only a controlled private account and a manually selected SELF_ONLY value returned by fresh Creator Info are permitted
      - privacy has no default; Comment, Duet and Stitch are off by default and remain disabled when Creator Info disallows them
      - commercial-content and AI disclosures plus applicable Music and Branded Content policy consent are part of the immutable final confirmation
      - media transfer is PULL_FROM_URL only; COS remains private and the final-confirmed object is exposed through a provider-only HTTPS URL bound to object key, SHA-256, byte size, GET and a fixed 65-minute lifetime
      - the provider-only media URL is secret-equivalent and must not enter browsers, databases, task payloads, audit events, logs, metrics, errors, screenshots or review videos; the ingress access log skips the exact media route
      - TikTok Dashboard reports review.jingtangai.com as a verified Domain property for the provider-only media route; the exact Revision 9 candidate is deployed under hold-worker while fresh provider-use evidence remains a separate gate
      - a private unaudited post may complete without a public post ID or external link; the UI must not fabricate one
      - disconnect denies first, invokes the TikTok revoke endpoint, retires the token key and removes local authorization data without claiming to delete a TikTok-hosted post
      - company TikTok Organization owns the durable App identity; Review secrets, tokens, redirect URLs, Sandbox users, data and runtime configuration are retired before future production cutover
      - Revision 9 approved PULL_FROM_URL remediation locally on 2026-08-29, the exact Review Domain property was verified, and exact candidate 8d35648aac362d2722671fdd8ae7d418368aa235 was deployed with hold-worker; submission readiness still requires a separately authorized fresh Human E2E and Acceptance evidence
    r4_entry_gates:
      scope_approval_package: prepared_2026_08_27
      scope_approval: passed_2026_08_27
      external_app_or_credential_use: authorized_for_exact_r4_scope
      implementation: review_deployed_endpoint_fix_verified_technical_stage_accepted
      human_e2e_write: one_controlled_private_self_only_publish_and_automatic_lifecycle_passed
      acceptance_review: passed_2026_08_28
      technical_stage_acceptance: passed_2026_08_28
      external_review_submission: unified_r5_separately_gated
      revision_9_local_implementation: passed_verification_and_code_review_2026_08_29
      revision_9_url_property: review_domain_verified_2026_08_29
      revision_9_deployment: exact_candidate_8d35648aac362d2722671fdd8ae7d418368aa235_hold_worker_deployed_verified_2026_08_29
      r5_policy_revalidation: revision_9_pull_from_url_local_domain_and_deployment_complete_fresh_human_e2e_pending_2026_08_29

