name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://jingtang_app:unused@127.0.0.1:5432/jingtang
      IDENTITY_PROVIDER: mock
      ALLOW_TEST_IDENTITY: "true"
      SESSION_COOKIE_SECRET: ci-session-cookie-secret-at-least-32-bytes
      TERMS_VERSION: 2026-08-28-r4.5
      PRIVACY_VERSION: 2026-08-28-r4.5
      DATA_PURPOSE_VERSION: 2026-08-28-r4.5
      TERMS_URL: https://jingtangai.com/en/terms/
      PRIVACY_URL: https://jingtangai.com/en/privacy/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Block unsafe cloud and container configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          timeout: 10m
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
