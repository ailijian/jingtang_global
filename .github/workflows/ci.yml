name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      APP_ENV: test
      APP_BASE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://jingtang_app:unused@127.0.0.1:5432/jingtang
      IDENTITY_PROVIDER: mock
      ALLOW_TEST_IDENTITY: "true"
      SESSION_COOKIE_SECRET: ci-session-cookie-secret-at-least-32-bytes
      TERMS_VERSION: 2026-08-21
      PRIVACY_VERSION: 2026-08-21
      DATA_PURPOSE_VERSION: 2026-08-21
      TERMS_URL: https://jingtangai.com/en/terms/
      PRIVACY_URL: https://jingtangai.com/en/privacy/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
